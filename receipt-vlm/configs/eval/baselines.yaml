# Zero-shot baselines (Phase 3). Same prompt, greedy decoding, same max_new_tokens and image
# cap for every model (CLAUDE.md §5.5). `make eval-baselines SPLIT=val`
seed: 1234
data_dir: data/processed
preds_dir: outputs/preds
metrics_dir: outputs/metrics
bootstrap: {resamples: 2000}
generation: {max_new_tokens: 1024}
# Qwen3-VL: H and W rounded to multiples of 32, pixel count clamped to [min, max].
# 1024*32*32 px = at most 1,024 visual tokens per receipt.
image: {min_pixels: 65536, max_pixels: 1048576}
subset: {val: null, test: null}   # e.g. {val: 200} for a quick look; null = full split
batch_size: 4
models:
  B0:
    desc: Tesseract 5 OCR (2-pass script-aware, PSM 6) + Qwen3-1.7B (thinking off), zero-shot
    backend: ocr_llm
    ocr_langs: eng+ara+rus
    llm: {backend: hf, model: Qwen/Qwen3-1.7B}
    batch_size: 1
  B1:
    desc: Qwen3-VL-2B-Instruct, zero-shot
    backend: hf
    model: Qwen/Qwen3-VL-2B-Instruct
  B2:
    desc: Qwen3-VL-4B-Instruct, zero-shot
    backend: hf
    model: Qwen/Qwen3-VL-4B-Instruct
  B3:
    desc: Qwen3-VL-8B-Instruct, zero-shot (4-bit NF4 on 16 GB GPUs)
    backend: hf
    model: Qwen/Qwen3-VL-8B-Instruct
    load_in_4bit: true
    batch_size: 2
