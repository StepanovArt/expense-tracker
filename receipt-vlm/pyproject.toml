[project]
name = "receipt-vlm"
version = "0.1.0"
description = "Receipt photos -> strict JSON with a fine-tuned Qwen3-VL-2B (SFT + GRPO), with statistically sound evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pillow>=10.4",
    "imagehash>=4.3",
    "rapidfuzz>=3.9",
    "faker>=30.0",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Model inference / training on CPU or GPU (HF transformers code path).
ml = [
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=5.0",
    "peft>=0.17",
    "trl>=1.0",
    "accelerate>=1.10",
    "datasets>=4.0",
    "qwen-vl-utils>=0.0.14",
]
# GPU-only fast paths; installed on the training / serving machine, never in CI.
gpu = [
    "bitsandbytes>=0.45",
    "unsloth>=2025.10",
    "vllm>=0.11",
]
ocr = ["pytesseract>=0.3.13"]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "gradio>=5.0",
]
tracking = ["wandb>=0.18"]
hub = ["huggingface-hub>=0.34"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "pre-commit>=3.8",
    "types-pyyaml",
    "pandas-stubs",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[project.scripts]
receipt-vlm = "receipt_vlm.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_vlm"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "N812", "PTH123"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["receipt_vlm"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
show_error_codes = true
plugins = ["pydantic.mypy"]

# Strict where correctness matters most (CLAUDE.md §3).
[[tool.mypy.overrides]]
module = [
    "receipt_vlm.schema",
    "receipt_vlm.eval.*",
    "receipt_vlm.rewards.*",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 600
markers = [
    "slow: needs torch/transformers and builds a tiny model (still CPU-only)",
    "data: needs downloaded raw datasets under data/raw (skipped when absent)",
]
filterwarnings = ["ignore::DeprecationWarning"]
